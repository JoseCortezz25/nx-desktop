<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revisar hooks - wireframe</title>
  <link rel="stylesheet" href="assets/wireframe.css">
  <style>
    /* Full 1916x1030 page. The reference crop (1176x857) sits at offset (425,157),
       so every coordinate below is the crop coordinate plus that offset. */
    html, body { margin: 0; }
    body { background: #fff; }
    .stage { position: relative; width: 1916px; height: 1030px; overflow: hidden; background: #fff; }

    /* Shell behind the dialog (dimmed by the overlay) */
    .ctx { position: absolute; left: 753px; top: 859px; width: 780px; height: 41px; background: #f2f2f2; border-radius: 14px 14px 0 0; display: flex; align-items: center; gap: 28px; padding: 0 12px 0 14px; font-size: 13px; color: var(--text); }
    .ctx span { display: inline-flex; align-items: center; gap: 9px; }
    .ctx svg.i { width: 16px; height: 16px; color: var(--text); }
    .ctx .gear { margin-left: auto; }
    .ctx .gear svg.i { width: 16px; height: 16px; color: var(--muted); }

    .shell-composer { position: absolute; left: 739px; top: 900px; width: 809px; height: 109px; background: #fff; border-radius: 18px; box-shadow: var(--shadow-md); }
    .shell-composer .ph { position: absolute; left: 13px; top: 18px; font-size: 14px; line-height: 20px; color: var(--muted); }
    .shell-composer .bar { position: absolute; left: 16px; right: 9px; top: 75px; height: 20px; display: flex; align-items: center; }
    .shell-composer .bar svg.i { color: var(--text); }
    .shell-composer .plus { width: 18px; height: 18px; }
    .shell-composer .pill { display: inline-flex; align-items: center; gap: 6px; margin-left: 22px; font-size: 13px; color: var(--warn); white-space: nowrap; }
    .shell-composer .pill svg.i { width: 14px; height: 14px; color: var(--warn); }
    .shell-composer .hook { position: relative; display: inline-flex; margin-left: 21px; }
    .shell-composer .hook svg.i { width: 16px; height: 16px; }
    .shell-composer .hook::after { content: ""; position: absolute; top: -3px; right: -4px; width: 6px; height: 6px; border-radius: 50%; background: #f5b82e; }
    .shell-composer .right { margin-left: auto; display: flex; align-items: center; }
    .shell-composer .model { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; color: var(--text); }
    .shell-composer .model .muted { color: var(--muted); }
    .shell-composer .model svg.i { width: 10px; height: 10px; color: var(--muted); }
    .shell-composer .mic { width: 13px; height: 13px; margin-left: 24px; margin-right: 17px; }
    .shell-composer .send { width: 30px; height: 30px; border-radius: 50%; background: #111; display: grid; place-items: center; }
    .shell-composer .send svg.i { width: 15px; height: 15px; color: #fff; stroke-width: 2; }

    .headline { position: absolute; left: 1307px; top: 516px; font-size: 28px; line-height: 34px; color: #4a4a4a; white-space: nowrap; text-decoration: underline dotted; text-underline-offset: 6px; }

    /* Backdrop: dims the shell and the headline */
    .overlay { position: absolute; inset: 0; display: block; background: rgba(0,0,0,.14); z-index: 10; }

    /* Dialog: 748x456 at page (584,287) */
    .dialog { position: absolute; left: 584px; top: 287px; width: 748px; height: 456px; padding: 24px 22px 23px; border-radius: 18px; background: #fff; border: 1px solid rgba(0,0,0,.04); box-shadow: 0 10px 30px rgba(0,0,0,.14), 0 2px 6px rgba(0,0,0,.05); display: flex; flex-direction: column; }
    .dialog h3 { margin: 0; font-size: 22px; line-height: 29px; font-weight: 600; letter-spacing: -.2px; color: #111; }

    .hooks { margin-top: 13px; display: flex; flex-direction: column; gap: 9px; }
    .hook-row { display: flex; align-items: center; height: 46px; padding: 0 27px 0 14px; border: 1px solid #e6e6e6; border-radius: 10px; background: #fcfcfc; color: var(--text); font-size: 14px; }
    .hook-row.hover { background: #f4f4f4; border-color: #e0e0e0; }
    .hook-row .cb { width: 16px; height: 16px; flex: none; border: 1.5px solid #9a9a9a; border-radius: 4px; background: #fff; margin-right: 13px; }
    .hook-row .name { font-weight: 600; font-size: 14px; color: #111; }
    .hook-row .badge-new { margin-left: 12px; display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; background: #d6f5e2; color: #1e9e57; font-size: 12px; font-weight: 600; }
    .hook-row svg.i { margin-left: auto; width: 12px; height: 12px; color: #666; }

    .footer { margin-top: 12px; height: 34px; display: flex; align-items: center; justify-content: space-between; }
    .footer .note { font-size: 12px; line-height: 16px; color: #7a7a7a; }
    .footer .note u { text-underline-offset: 2px; color: #5c5c5c; }
    .footer .actions { display: flex; gap: 13px; }
    .footer .actions span { display: inline-flex; align-items: center; justify-content: center; height: 34px; border-radius: 10px; background: #f3f3f3; color: #222; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .footer .actions .ahora { width: 100px; }
    .footer .actions .todo { width: 127px; }
    .footer .actions .sel { width: 172px; background: #9c9c9c; color: #fff; font-weight: 500; box-shadow: none; cursor: not-allowed; }
  </style>
</head>
<body>
<div class="stage">

  <!-- Shell behind the dialog: context bar and composer -->
  <div class="ctx">
    <span>
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4.2l2 2.5H19a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      NX Desktop

    <span>
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 20h20"/></svg>
      Este ordenador
    </span>
    <span class="gear">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    </span>
  </div>

  <div class="shell-composer">
    <div class="ph">Dime qué quieres hacer</div>
    <div class="bar">
      <svg class="i plus" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span class="pill">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        Acceso completo
      </span>
      <span class="hook">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="3"/><path d="M12 22V8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/></svg>
      </span>
      <div class="right">
        <span class="model">
          <span>GPT-6.1 Sol</span>
          <span class="muted">Ligero</span>
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </span>
        <svg class="i mic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></svg>
        <span class="send">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 10v3M6 6v11M10 3v18M14 8v7M18 5v13M22 10v3"/></svg>
        </span>
      </div>
    </div>
  </div>

  <!-- Partial heading peeking out to the right of the dialog -->
  <span class="headline">…sktop?</span>

  <!-- Dimmed backdrop and dialog -->
  <div class="overlay">
    <div class="dialog" role="dialog" aria-label="Revisar hooks">
      <h3>Revisar hooks</h3>

      <div class="hooks">
        <div class="hook-row">
          <span class="cb"></span>
          <span class="name">Hook 1</span>
          <span class="badge-new">Nuevo</span>
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <div class="hook-row hover">
          <span class="cb"></span>
          <span class="name">Hook 2</span>
          <span class="badge-new">Nuevo</span>
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <div class="hook-row">
          <span class="cb"></span>
          <span class="name">Hook 3</span>
          <span class="badge-new">Nuevo</span>
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <div class="hook-row">
          <span class="cb"></span>
          <span class="name">Hook 4</span>
          <span class="badge-new">Nuevo</span>
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <div class="hook-row">
          <span class="cb"></span>
          <span class="name">Hook 5</span>
          <span class="badge-new">Nuevo</span>
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <div class="hook-row">
          <span class="cb"></span>
          <span class="name">Hook 6</span>
          <span class="badge-new">Nuevo</span>
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>

      <div class="footer">
        <span class="note">Puedes cambiarlo más tarde en <u>Ajustes</u></span>
        <div class="actions">
          <span class="ahora">Ahora no</span>
          <span class="todo">Permitir todo</span>
          <span class="sel" aria-disabled="true">Permitir la selección</span>

  </div>

</div>
</body>
</html>
