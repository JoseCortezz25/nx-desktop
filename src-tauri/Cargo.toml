[package]
name = "nx-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nx_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
# Claude provider adapter (issue #25): raw HTTPS + SSE streaming against the
# Messages API. reqwest 0.13 names its rustls backend `rustls` (the 0.12
# `rustls-tls` feature no longer exists).
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
# Codex provider adapter (issue #26): signal the CLI's process group on cancel.
libc = "0.2"

[dev-dependencies]
# Local mock HTTP server for the Claude adapter streaming tests.
tokio = { version = "1", features = ["net", "io-util"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
